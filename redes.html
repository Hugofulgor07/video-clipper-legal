  <style>
    :root {
      color-scheme: light dark;
      --bg: #f2f2f7;
      --card: #ffffff;
      --label: #000000;
      --label-2: rgba(60, 60, 67, 0.6);
      --label-3: rgba(60, 60, 67, 0.3);
      --tint: #6f5cf0;
      --glow: rgba(111, 92, 240, 0.28);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --card: #1c1c1e;
        --label: #ffffff;
        --label-2: rgba(235, 235, 245, 0.6);
        --label-3: rgba(235, 235, 245, 0.3);
        --tint: #9a8cff;
        --glow: rgba(154, 140, 255, 0.35);
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, Roboto, sans-serif;
      background:
        radial-gradient(60rem 28rem at 50% -8rem, var(--glow), transparent 70%),
        var(--bg);
      color: var(--label);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    main {
      max-width: 26rem;
      margin: 0 auto;
      padding: calc(env(safe-area-inset-top) + 3rem) 1rem calc(env(safe-area-inset-bottom) + 2rem);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .avatar {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 0 0 4px var(--card), 0 12px 32px var(--glow);
    }
    h1 {
      margin: 1.1rem 0 0;
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      text-align: center;
    }
    .handle { margin: 0.15rem 0 0; color: var(--label-2); font-size: 1rem; }
    .bio {
      margin: 0.9rem 0 0;
      max-width: 20rem;
      text-align: center;
      font-size: 1rem;
      line-height: 1.4;
      color: var(--label-2);
    }
    .links { width: 100%; margin: 2rem 0 0; padding: 0; list-style: none; display: grid; gap: 0.75rem; }
    .link {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      min-height: 4.5rem;
      padding: 0.75rem 1rem;
      border-radius: 1.1rem;
      background: var(--card);
      color: var(--label);
      text-decoration: none;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
      transition: transform 0.12s ease, opacity 0.12s ease;
    }
    .link:active { transform: scale(0.98); opacity: 0.85; }
    .icon {
      flex: none;
      width: 2.75rem;
      height: 2.75rem;
      border-radius: 0.75rem;
      display: grid;
      place-items: center;
    }
    .icon svg { width: 100%; height: 100%; }
    .tiktok { background: #000; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.15); }
    .instagram { background: linear-gradient(45deg, #feda75, #fa7e1e 25%, #d62976 50%, #962fbf 75%, #4f5bd5); }
    .facebook { background: #1877f2; }
    .youtube { background: #ff0000; }
    .text { flex: 1; min-width: 0; }
    .title { display: block; font-size: 1.0625rem; font-weight: 600; }
    .sub { display: block; font-size: 0.875rem; color: var(--label-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chevron { flex: none; width: 0.6rem; height: 1rem; color: var(--label-3); }
    footer { margin-top: 2.5rem; font-size: 0.8125rem; color: var(--label-3); }
    footer a { color: var(--label-2); text-decoration: none; }
  </style>
</head>

  <script>
    // Conteo de visitas y clics (sin cookies). Vacios = apagado.
    var ANALYTICS = { cloudflareToken: '', goatcounterCode: '' };
    function addScript(src, attrs) {
      var script = document.createElement('script');
      script.async = true;
      script.src = src;
      for (var key in attrs) script.setAttribute(key, attrs[key]);
      document.body.appendChild(script);
    }
    if (ANALYTICS.cloudflareToken) {
      addScript('https://static.cloudflareinsights.com/beacon.min.js', {
        'data-cf-beacon': JSON.stringify({ token: ANALYTICS.cloudflareToken })
      });
    }
    if (ANALYTICS.goatcounterCode) {
      addScript('https://gc.zgo.at/count.js', {
        'data-goatcounter': 'https://' + ANALYTICS.goatcounterCode + '.goatcounter.com/count'
      });
    }
  </script>
